name: Comlink
options:
  bundleIdPrefix: io.containerlabs
  deploymentTarget:
    iOS: "17.0"
targets:
  Comlink:
    type: application
    platform: iOS
    sources: [Comlink]
    info:
      path: Comlink/Info.plist
      properties:
        CFBundleDisplayName: Comlink
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    dependencies:
      - framework: ../.local/ComlinkNative.xcframework
        embed: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.containerlabs.comlink
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Comlink
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1,2"
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      configs:
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: "iPhone Distribution"
          PROVISIONING_PROFILE_SPECIFIER: "Comlink App Store Local"
    scheme:
      testTargets: [ComlinkTests]
  ComlinkTests:
    type: bundle.unit-test
    platform: iOS
    sources: [ComlinkTests]
    dependencies:
      - target: Comlink
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
